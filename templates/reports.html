<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports & Analytics — TRINETRA</title>
</head>
<body style="background: #0A0E13; color: #EAEFF3; font-family: sans-serif; padding: 30px;">
    <h1>Municipal Analytics & Reports</h1>
    <p style="color: #9AA7B4; margin-bottom: 20px;">Live summary generated directly from dashboard telemetry.</p>
    
    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
        <div style="background: #0F151C; border: 1px solid #212B36; padding: 20px; border-radius: 8px; flex: 1;">
            <h3>Total Potholes Logged</h3>
            <p id="report-pothole-count" style="font-size: 2rem; font-weight: bold; color: #FF5470;">0</p>
        </div>
        <div style="background: #0F151C; border: 1px solid #212B36; padding: 20px; border-radius: 8px; flex: 1;">
            <h3>Total Garbage Dumps Logged</h3>
            <p id="report-garbage-count" style="font-size: 2rem; font-weight: bold; color: #FBBF24;">0</p>
        </div>
    </div>

    <div style="margin-bottom: 20px;">
        <a href="/download/csv" style="background: #00ADB5; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">Download CSV Report</a>
        <a href="/dashboard" style="background: #212B36; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-left: 10px;">Back to Dashboard</a>
    </div>

    <h2>Live Incident Records</h2>
    <table border="1" style="width: 100%; border-collapse: collapse; border-color: #212B36; margin-top: 10px;">
        <thead>
            <tr style="background: #141C25; text-align: left;">
                <th style="padding: 10px;">Timestamp</th>
                <th style="padding: 10px;">Hazard Type</th>
                <th style="padding: 10px;">Severity</th>
                <th style="padding: 10px;">Confidence</th>
                <th style="padding: 10px;">Coordinates</th>
            </tr>
        </thead>
        <tbody id="report-table-body">
            <tr><td colspan="5" style="padding: 15px; text-align: center;">Loading live data from dashboard...</td></tr>
        </tbody>
    </table>

    <script>
        function loadDashboardDataToReports() {
            fetch('/api/logs')
                .then(res => res.json())
                .then(data => {
                    const logs = data.logs || [];
                    const tbody = document.getElementById('report-table-body');
                    tbody.innerHTML = '';

                    if (logs.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="padding: 15px; text-align: center;">No hazard logs recorded yet.</td></tr>';
                        return;
                    }

                    logs.forEach(log => {
                        tbody.innerHTML += `
                            <tr>
                                <td style="padding: 10px;">${log.Timestamp}</td>
                                <td style="padding: 10px;">${log.Hazard_Type}</td>
                                <td style="padding: 10px;">${log.Severity}</td>
                                <td style="padding: 10px;">${log.Confidence}</td>
                                <td style="padding: 10px;">${log.Latitude}, ${log.Longitude}</td>
                            </tr>
                        `;
                    });

                    document.getElementById('report-pothole-count').innerText = data.pothole_count || 0;
                    document.getElementById('report-garbage-count').innerText = data.garbage_count || 0;
                })
                .catch(err => console.error("Failed to load dashboard data into reports:", err));
        }
        window.addEventListener('DOMContentLoaded', loadDashboardDataToReports);
    </script>
</body>
</html>
